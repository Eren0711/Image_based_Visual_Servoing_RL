# =============================================================================
# RL-Based Image-Guided Drone Interception — Stage 3a Configuration
# Reference: "High-Speed Interception Multicopter Control by IBVS"
#            Yang, Bai, She, Quan (arXiv:2404.08296)
#
# Stage 3a: First-Order Inertia + Attitude-Camera Coupling
#   - Drone velocity responds with τ=0.2s time constant (realistic lag)
#   - Pitch/roll derived from acceleration → camera tilts with maneuvers
#   - Attitude stability penalty added to reward
#   - FRESH training (dynamics fundamentally changed)
#
# Coordinate convention: NED (North-East-Down), z-axis points downward
# =============================================================================

# --- Camera parameters ---
camera:
  f_oc: 300.0
  alpha_hfov: 1.2217               # ~70°
  alpha_vfov: 0.9599               # ~55°
  R_c_b_euler: [0.0, -1.5707963, 0.0]

# --- Interceptor drone ---
interceptor:
  # Model selector: 'kinematic_3a' or 'multicopter_6dof'
  #   kinematic_3a    — first-order velocity lag + pitch=arctan(a/g) coupling
  #                      (Stage 3a model, default for backward compat)
  #   multicopter_6dof — full Newton-Euler dynamics with SO(3) PD attitude
  #                      controller, quaternion attitude, motor & rate-loop lag
  #                      (Stage 3b "lite" — no drag, no rotor mixing)
  model: 'multicopter_6dof'

  # Shared parameters (used by both models)
  v_max: 15.0
  a_max: 10.0
  yaw_rate_max: 0.7854             # ~π/4
  dt: 0.02                         # 50 Hz
  max_pitch_deg: 35.0
  max_roll_deg:  35.0

  # Stage 3a kinematic-model parameters (ignored when model='multicopter_6dof')
  tau_velocity: 0.15
  tau_yaw_rate: 0.10

  # Stage 3b 6-DOF-model parameters (ignored when model='kinematic_3a')
  dynamics_6dof:
    mass: 1.0                      # kg — typical small quad
    J_xx: 0.01                     # kg·m² body-x inertia
    J_yy: 0.01                     # kg·m² body-y inertia
    J_zz: 0.02                     # kg·m² body-z inertia (slightly higher,
                                   # asymmetric yaw inertia typical for quads)
    tau_motor: 0.05                # motor thrust response time constant (s)
                                   # 0.05s ≈ typical BLDC + ESC bandwidth
    tau_rate:  0.05                # rate-loop tracking time constant (s)
                                   # Captures inner-loop attitude bandwidth
                                   # (200 Hz in paper Eq. 28 → ~5ms; we use
                                   # 50ms because the env steps at 50 Hz and
                                   # finer would require sub-stepping)
    thrust_to_weight: 3.0          # max thrust / weight (matches paper)
    omega_max: 4.0                 # body angular velocity saturation (rad/s)
                                   # ~230°/s, typical for aggressive flight
    k_attitude: 6.0                # SO(3) PD gain on attitude error
                                   # Higher = stiffer R_d tracking

# --- Target drone ---
target:
  v_max: 10.0
  a_max: 5.0
  maneuver_modes: ['constant_velocity', 'sinusoidal']
  sin_amplitude: 3.0
  sin_frequency: 1.5
  circle_radius: 15.0
  circle_omega: 0.5
  random_switch_interval: 25

# --- Environment ---
env:
  max_steps: 500
  d_success: 2.0                   # Was 0.5 — physically achievable given the
                                   # 2.25 m braking distance at v_max=15, τ=0.15.
                                   # 2.0 m miss distance is realistic for ~30cm
                                   # drone-on-drone visual interception.
  d_image_cutoff: 25.0             # Distance beyond which image-centering reward
                                   # is zero. Closes the loiter-at-distance local
                                   # optimum: without this gate, the agent could
                                   # harvest +0.4/step image reward at 35m while
                                   # avoiding FOV-loss risk, dominating commits.
                                   # With cutoff=25: image reward decays linearly
                                   # to 0 at 25m, full value at the target. Loiter
                                   # at >=25m now pays zero image reward, only
                                   # closure earns positive returns.
  fov_loss_limit: 15                # 10 (clean v2) → 15 for noisy stages.
                                   # The -5/-20 experiment showed reward tuning doesn't
                                   # rescue noise-induced FOV losses; this modest bump
                                   # gives the DKF time to re-acquire after a brief
                                   # slip without making episodes drag on indefinitely.
  init_distance_range: [10.0, 30.0]
  norm_distance_max: 50.0
  norm_velocity_max: 15.0

# --- Depth estimator ---
depth_estimator:
  rho_init: 0.05
  P_init: 1.0
  Q: 0.001
  R_base: 0.1
  rho_min: 0.005
  rho_max: 2.0
  confidence_threshold: 0.01

# --- Measurement noise and delay ---
# Operating points tested:
#   --- Kinematic dynamics (Stage 3a) ---
#   delay=1, sigma=0.015 + CV DKF:         62%  (3a-noisy-mild, 7.0M, 50 ep)
#   delay=1, sigma=0.015 + CV DKF + brake: 66%  (3a-noisy-mild-polished, 7.8M, 50 ep)
#   delay=1, sigma=0.015 + IMU DKF:        66%  (3a-noisy-imu-dkf, 5.0M, 50 ep)
#   delay=3, sigma=0.03  + CV DKF:          0%  (3a-noisy-full; collapsed)
#   delay=3, sigma=0.03  + IMU DKF:         0%  (3a-noisy-full-imu-dkf; collapsed)
#   --- 6-DOF dynamics (Stage 3b) ---
#   clean (no wrapper):                    96.0% (3b-clean, 7M, 200 ep seed=1000)
#   delay=1, sigma=0.015 + IMU DKF:        96.5% (3b-noisy-mild, 4M, 200 ep seed=1000)
#   delay=3, sigma=0.03  + IMU DKF:         ~2% (3b-noisy-full; collapsed, stopped early)
#   --- 6-DOF + CBF safety filter (Stage 4a) ---
#   CBF bolt-on (no retrain), 3b-noisy-mild policy:    84%  / 16% FOV / 0 pitch-roll viol
#   CBF in training loop, fine-tune 3M steps + LR decay: 85.5% / 14.5% FOV / 0 viol (2M ckpt)
#   Fine-tuning bought only 1.5pp over bolt-on. The bisection CBF only
#   *scales* actions (no direction change), so the policy can't learn a
#   winning strategy — it's throttled on 87% of steps. The 11pp gap vs
#   baseline is the cost of the current CBF formulation, not a fundamental
#   safety-vs-performance trade. Phase 4a.3 would need to upgrade to proper
#   HOCBF / ECBF with analytical gradients through the SO(3) PD law to
#   allow the QP to redirect actions, not just throttle them.
# Conclusion: the 4-dim image-plane DKF saturates between mild and full noise,
# independent of the inner-loop dynamics (kinematic vs 6-DOF). IMU feedforward
# eliminates the brake-penalty hack at mild noise but cannot close the full-spec
# ceiling — that requires the paper's 18-dim EKF (quaternion attitude + IMU bias
# states), which is out of scope for this project.
# Mild noise kept as the canonical working spec for downstream stages.
noise_delay:
  delay: 1
  sigma_noise: 0.015

# --- DKF parameters ---
dkf:
  sigma_pos_process: 0.01
  sigma_vel_process: 0.5
  sigma_measurement: 0.03
  P_init_pos: 0.1
  P_init_vel: 1.0

# --- Reward weights ---
# Stage 3a-v2 rebalance (Option B fixes):
#   Root cause of v1 failure (2% deterministic success, 50% FOV loss):
#   image-centering reward dominated closure reward, so the policy
#   learned to fly past the target while keeping it framed.
#
#   Changes from v1:
#     w_image:        1.0  →  0.4   (de-emphasize pure tracking)
#     w_approach:     0.6  →  2.0   (make closure progress dominate)
#     w_dist_penalty: NEW  → -0.02  (per-step anti-loiter pressure)
reward:
  w_image:        0.4
  w_approach:     2.0
  w_dist_penalty: -0.15        # 0.02 → 0.15 after stage3a_noisy_mild showed the
                               # loiter local optimum: agent backed off to 40m+
                               # to harvest +0.24/step image reward against only
                               # -0.016/step distance penalty (net +0.17/step).
                               # At -0.15: 40m gives -0.12/step, which outweighs
                               # image reward and forces closure. At d_success
                               # (2m): -0.006/step, negligible — doesn't punish
                               # near-target hovering during terminal approach.
  w_near_brake:   -0.05        # Near-target braking penalty. 79% of FOV losses
                               # in noisy-mild ended at d=2.5-5m — agent over-
                               # commits terminally and pitches too hard right
                               # at the success threshold. Penalty form:
                               #   w * |v_body| * max(0, (d_brake - d)/d_brake)
                               # Zero outside d_brake. Inside, scales with both
                               # speed and proximity. At d=2m, v=5m/s: -0.15/step;
                               # at d=4m, v=10m/s: -0.10/step. Doesn't affect
                               # cruise (d>d_brake) and doesn't punish slow
                               # near-target hovering.
  d_brake:         5.0         # Distance threshold (m) below which the near-
                               # target brake penalty activates.
  w_fov_loss: -3.0                  # -20 (v2 clean) → -3 (3a-noisy).
                                   # Previously -5 didn't help because loiter was
                                   # the optimal strategy regardless of FOV penalty
                                   # magnitude. With image reward now gated by
                                   # distance (d_image_cutoff), loiter pays -107
                                   # per episode and the only positive-reward
                                   # strategy is commit. The breakeven success
                                   # rate for "commit beats loiter" is ~33%; at
                                   # -20 per FOV step (×15 steps = -300 per failed
                                   # commit) the agent can't get there through
                                   # exploration because failed attempts cost too
                                   # much. At -3, failed commits cost only -17,
                                   # so the gradient supports learning from
                                   # repeated unsuccessful attempts.
  w_boundary: -0.5
  w_effort:   -0.05
  w_jerk:     -0.05
  w_attitude: -0.1
  w_intercept: 200.0
  w_timeout:  -0.05
  k1_image:   5.0

# --- Training ---
training:
  algorithm: PPO
  total_timesteps: 15_000_000    # Fresh training — harder problem
  n_envs: 16
  policy: MlpPolicy
  learning_rate: 0.0003          # Standard LR (fresh training)
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  log_dir: ./logs/tensorboard
  save_dir: ./logs/models
  checkpoint_freq: 200000
  # Deterministic eval cadence (Stage 3a-v2 lesson: trust det-eval, not stochastic)
  eval_freq: 1000000          # run det-eval every N training steps
  eval_n_episodes: 20         # episodes per det-eval run (~20s wall-time)

# --- Evaluation ---
evaluation:
  n_episodes: 50
  deterministic: true
  save_dir: ./logs/eval
  render: false
